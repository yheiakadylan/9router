name: Build Package and Deploy EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-ec2
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/yheiakadylan/9router

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Deploy package to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_NAME,IMAGE_TAG
          script: |
            set -eu
            mkdir -p ~/9router
            cd ~/9router
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            mkdir -p "$HOME/.9router"

            cat > docker-compose.ec2.yml <<'EOF'
            services:
              9router:
                image: ${IMAGE_NAME:-ghcr.io/yheiakadylan/9router}:${IMAGE_TAG:-latest}
                container_name: 9router
                restart: always
                ports:
                  - "20128:20128"
                volumes:
                  - "${ROUTER_DATA_DIR}:/app/data"
                environment:
                  DATA_DIR: /app/data
                  PORT: "20128"
                  HOSTNAME: 0.0.0.0
                  NODE_ENV: production
                  API_WORKERS: "4"
                  UV_THREADPOOL_SIZE: "8"
                  NINEROUTER_PROXY_CLIENT_MAX_BODY_SIZE: "128mb"
                healthcheck:
                  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20128/api/health"]
                  interval: 10s
                  timeout: 5s
                  retries: 6
                  start_period: 40s
            EOF

            # Configure Nginx reverse proxy client_max_body_size (fix 413 Request Entity Too Large)
            if command -v nginx >/dev/null 2>&1 && [ -d /etc/nginx ]; then
              echo "=== Configuring Nginx client_max_body_size ==="
              for f in /etc/nginx/nginx.conf /etc/nginx/conf.d/*.conf /etc/nginx/sites-available/* /etc/nginx/sites-enabled/*; do
                if [ -f "$f" ] && sudo grep -q "client_max_body_size" "$f" 2>/dev/null; then
                  sudo sed -i -E 's/client_max_body_size[[:space:]]+[^;]+;/client_max_body_size 128M;/g' "$f" || true
                fi
              done
              if ! sudo grep -rq "client_max_body_size" /etc/nginx/nginx.conf /etc/nginx/conf.d/ 2>/dev/null; then
                sudo mkdir -p /etc/nginx/conf.d
                printf 'client_max_body_size 128M;\n' | sudo tee /etc/nginx/conf.d/9router-body-size.conf >/dev/null
              fi
              if sudo nginx -t 2>/dev/null; then
                sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || true
                echo "Nginx reloaded with client_max_body_size 128M"
              else
                sudo rm -f /etc/nginx/conf.d/9router-body-size.conf 2>/dev/null || true
              fi
            fi

            # Ensure swapfile exists to avoid OOM
            if ! swapon --show | grep -q "/swapfile"; then
              if [ ! -f /swapfile ]; then
                echo "Creating 2G swapfile..."
                sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null || true
                sudo chmod 600 /swapfile 2>/dev/null || true
                sudo mkswap /swapfile 2>/dev/null || true
              fi
              sudo swapon /swapfile 2>/dev/null || true
            fi

            echo "=== System resources ==="
            free -h

            echo "=== Checking port 20128 before cleanup ==="
            sudo ss -tulpn | grep 20128 || true

            # 1. Stop PM2 or systemd if managing 9router
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop all 2>/dev/null || true
              pm2 delete all 2>/dev/null || true
              pm2 save 2>/dev/null || true
            fi
            sudo systemctl stop 9router 2>/dev/null || true
            sudo systemctl disable 9router 2>/dev/null || true

            # 2. Clean up any Docker container publishing port 20128 or named 9router
            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" ROUTER_DATA_DIR="$HOME/.9router" \
              docker compose -f docker-compose.ec2.yml down --remove-orphans 2>/dev/null || true
            PORT_CONTAINERS=$(sudo docker ps -q --filter "publish=20128" 2>/dev/null || true)
            if [ -n "$PORT_CONTAINERS" ]; then
              sudo docker rm -f $PORT_CONTAINERS 2>/dev/null || true
            fi
            sudo docker rm -f 9router 2>/dev/null || true

            # 3. Safely free port 20128 by specific PID
            PORT_PIDS=$(sudo lsof -t -i:20128 2>/dev/null || true)
            for p in $PORT_PIDS; do
              if [ "$p" != "$$" ]; then
                echo "Terminating process on port 20128: $p"
                sudo kill -9 "$p" 2>/dev/null || true
              fi
            done

            sleep 2

            echo "=== Port 20128 after cleanup ==="
            sudo ss -tulpn | grep 20128 || echo "Port 20128 is completely FREE"

            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" ROUTER_DATA_DIR="$HOME/.9router" \
              docker compose -f docker-compose.ec2.yml pull

            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" ROUTER_DATA_DIR="$HOME/.9router" \
              docker compose -f docker-compose.ec2.yml up -d --remove-orphans

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:20128/api/health >/dev/null; then
                sudo docker image prune -f
                sudo docker ps --filter name=9router
                echo "DEPLOY SUCCESSFUL!"
                exit 0
              fi
              sleep 2
            done

            sudo docker logs --tail 100 9router
            exit 1
