name: Build Package and Deploy EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-ec2
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/yheiakadylan/9router

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Deploy package to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_NAME,IMAGE_TAG
          script: |
            set -eu
            cd ~/9router
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            mkdir -p "$HOME/.9router"

            # Ð?m b?o có swapfile d? VPS không b? OOM (tràn RAM)
            if ! swapon --show | grep -q "/swapfile"; then
              if [ ! -f /swapfile ]; then
                echo "Creating 2G swapfile..."
                sudo fallocate -l 2G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null || true
                sudo chmod 600 /swapfile 2>/dev/null || true
                sudo mkswap /swapfile 2>/dev/null || true
              fi
              sudo swapon /swapfile 2>/dev/null || true
            fi

            echo "=== System resources ==="
            free -h

            echo "=== Checking port 20128 before cleanup ==="
            sudo ss -tulpn | grep 20128 || true

            # D?ng n?u có PM2 ho?c systemd dang qu?n lý 9router
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop all 2>/dev/null || true
              pm2 delete all 2>/dev/null || true
            fi
            sudo systemctl stop 9router 2>/dev/null || true
            sudo systemctl disable 9router 2>/dev/null || true

            # T?t ti?n trình next-server ho?c process chi?m port 20128
            sudo pkill -15 -f "next-server" 2>/dev/null || true
            sleep 1
            sudo pkill -9 -f "next-server" 2>/dev/null || true

            # D?n d?p docker container cu
            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" ROUTER_DATA_DIR="$HOME/.9router" \
              docker compose -f docker-compose.ec2.yml down --remove-orphans 2>/dev/null || true
            PORT_CONTAINERS=$(sudo docker ps -q --filter "publish=20128" 2>/dev/null || true)
            if [ -n "$PORT_CONTAINERS" ]; then
              sudo docker rm -f $PORT_CONTAINERS 2>/dev/null || true
            fi
            sudo docker rm -f 9router 2>/dev/null || true
            sudo pkill -9 -f "docker-proxy.*20128" 2>/dev/null || true

            sleep 2

            echo "=== Port 20128 after cleanup ==="
            sudo ss -tulpn | grep 20128 || echo "Port 20128 is completely FREE"

            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" ROUTER_DATA_DIR="$HOME/.9router" \
              docker compose -f docker-compose.ec2.yml pull

            sudo IMAGE_NAME="$IMAGE_NAME" IMAGE_TAG="$IMAGE_TAG" ROUTER_DATA_DIR="$HOME/.9router" \
              docker compose -f docker-compose.ec2.yml up -d --remove-orphans

            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:20128/api/health >/dev/null; then
                sudo docker image prune -f
                sudo docker ps --filter name=9router
                exit 0
              fi
              sleep 2
            done

            sudo docker logs --tail 100 9router
            exit 1