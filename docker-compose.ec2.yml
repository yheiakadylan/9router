services:
  9router:
    image: ${IMAGE_NAME:-ghcr.io/yheiakadylan/9router}:${IMAGE_TAG:-latest}
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - "${ROUTER_DATA_DIR}:/app/data"
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      API_WORKERS: "4"
      UV_THREADPOOL_SIZE: "8"
      NINEROUTER_PROXY_CLIENT_MAX_BODY_SIZE: "128mb"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20128/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
